<svg viewBox="0 0 1320 1000" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial, Helvetica, sans-serif">
  <title>Procurement Exception Command Center — Architecture</title>
  <desc>Disruption notices flow from three sources into the Supervity Auto Orchestrator, which coordinates ten Operators and writes results to Supabase. The Command Center reads and writes the same Supabase tables, uses Gemini separately for policies, insights, and chat, and routes uncertain cases to a human reviewer via the Workbench, whose decision writes back to Supabase.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b5cf6"/>
    </marker>
  </defs>

  <rect width="1320" height="1000" fill="#f8fafc"/>

  <!-- ================= Title ================= -->
  <text x="660" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">Procurement Exception Command Center</text>
  <text x="660" y="66" text-anchor="middle" font-size="13" fill="#64748b">Autopilot Asia Hackathon 2026 · Round 2 · Operations Track</text>

  <!-- ================= Tier 1: Sources ================= -->
  <text x="70" y="108" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1">01 · DISRUPTION SOURCES</text>
  <g font-size="13" fill="#0f172a">
    <rect x="70" y="118" width="160" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="150" y="149" text-anchor="middle">Email Intake</text>

    <rect x="260" y="118" width="160" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="340" y="149" text-anchor="middle">Teams Message</text>

    <rect x="450" y="118" width="220" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="560" y="143" text-anchor="middle">Manual Submission</text>
    <text x="560" y="160" text-anchor="middle" font-size="10.5" fill="#64748b">New Disruption page (single + batch)</text>
  </g>

  <!-- connectors sources -> orchestrator -->
  <line x1="150" y1="170" x2="330" y2="210" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="170" x2="340" y2="210" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="560" y1="170" x2="380" y2="210" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ================= Tier 2: Supervity Auto ================= -->
  <text x="70" y="200" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1">02 · SUPERVITY AUTO — AGENT ORCHESTRATION</text>
  <rect x="70" y="210" width="900" height="230" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="90" y="236" font-size="14" font-weight="700" fill="#312e81">Procurement Exception Commander (Orchestrator)</text>
  <text x="90" y="253" font-size="11" fill="#4338ca">Coordinates 10 specialized Operators in sequence for every notice</text>

  <!-- 10 operator boxes, 5x2 grid -->
  <g font-size="10.5" fill="#1e1b4b">
    <!-- row 1 -->
    <rect x="90" y="266" width="160" height="42" rx="8" fill="#ffffff" stroke="#a5b4fc"/>
    <text x="170" y="291" text-anchor="middle">Intake &amp; Normalize</text>

    <rect x="262" y="266" width="160" height="42" rx="8" fill="#ffffff" stroke="#a5b4fc"/>
    <text x="342" y="291" text-anchor="middle">Impact Mapper</text>

    <rect x="434" y="266" width="160" height="42" rx="8" fill="#ffffff" stroke="#a5b4fc"/>
    <text x="514" y="291" text-anchor="middle">True-Availability</text>

    <rect x="606" y="266" width="160" height="42" rx="8" fill="#ffffff" stroke="#a5b4fc"/>
    <text x="686" y="285" text-anchor="middle">Cascade</text>
    <text x="686" y="298" text-anchor="middle">Dependency</text>

    <rect x="778" y="266" width="172" height="42" rx="8" fill="#ffffff" stroke="#a5b4fc"/>
    <text x="864" y="285" text-anchor="middle">Shipment</text>
    <text x="864" y="298" text-anchor="middle">Logistics</text>

    <!-- row 2 -->
    <rect x="90" y="320" width="160" height="42" rx="8" fill="#ffffff" stroke="#a5b4fc"/>
    <text x="170" y="339" text-anchor="middle">Recovery</text>
    <text x="170" y="352" text-anchor="middle">Strategist</text>

    <rect x="262" y="320" width="160" height="42" rx="8" fill="#ffffff" stroke="#a5b4fc"/>
    <text x="342" y="339" text-anchor="middle">Contention</text>
    <text x="342" y="352" text-anchor="middle">Prioritisation</text>

    <rect x="434" y="320" width="160" height="42" rx="8" fill="#ffffff" stroke="#a5b4fc"/>
    <text x="514" y="339" text-anchor="middle">Penalty-Aware</text>
    <text x="514" y="352" text-anchor="middle">Cost</text>

    <rect x="606" y="320" width="160" height="42" rx="8" fill="#ffffff" stroke="#a5b4fc"/>
    <text x="686" y="339" text-anchor="middle">Execute &amp;</text>
    <text x="686" y="352" text-anchor="middle">Escalate</text>

    <rect x="778" y="320" width="172" height="42" rx="8" fill="#ffffff" stroke="#a5b4fc"/>
    <text x="864" y="339" text-anchor="middle">Supplier Risk</text>
    <text x="864" y="352" text-anchor="middle">Scorecard</text>
  </g>
  <text x="90" y="422" font-size="10.5" fill="#4338ca">Auto's own Slack-based human approval (Commander Approval) runs in parallel — separate from the Command Center's Workbench</text>

  <!-- ================= Gemini side box ================= -->
  <rect x="1010" y="210" width="240" height="120" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="1130" y="235" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">Gemini (LLM)</text>
  <text x="1130" y="256" text-anchor="middle" font-size="10.5" fill="#6d28d9">Powers Policies, Insights,</text>
  <text x="1130" y="270" text-anchor="middle" font-size="10.5" fill="#6d28d9">and AI Manager chat only</text>
  <text x="1130" y="292" text-anchor="middle" font-size="10" fill="#7c3aed" font-style="italic">Never used for agent</text>
  <text x="1130" y="306" text-anchor="middle" font-size="10" fill="#7c3aed" font-style="italic">orchestration (Auto's job)</text>

  <!-- ================= Tier 3: Supabase ================= -->
  <text x="70" y="472" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1">03 · SUPABASE — SYSTEM OF RECORD</text>
  <rect x="70" y="482" width="1180" height="90" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="90" y="508" font-size="13" font-weight="700" fill="#065f46">Live Postgres tables — read and written by both Auto and the Command Center</text>
  <text x="90" y="530" font-size="11" fill="#047857">disruption_notices · run_context · incident_log · workbench_items · policy_evaluations</text>
  <text x="90" y="548" font-size="11" fill="#047857">exception_config · supplier_scorecard · suppliers · purchase_order_lines · inventory_positions · contracts</text>

  <!-- connector orchestrator -> supabase -->
  <line x1="520" y1="440" x2="520" y2="482" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="530" y="465" font-size="10" fill="#64748b">writes results</text>

  <!-- gemini -> command center dashed -->
  <!-- drawn after command center box below -->

  <!-- ================= Tier 4: Command Center ================= -->
  <text x="70" y="614" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1">04 · COMMAND CENTER — NEXT.JS + FASTAPI</text>
  <rect x="70" y="624" width="900" height="200" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="90" y="650" font-size="14" font-weight="700" fill="#1e3a8a">Procurement Exception Command Center (this app)</text>

  <g font-size="11" fill="#1e3a8a">
    <rect x="90" y="664" width="160" height="60" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="170" y="688" text-anchor="middle" font-weight="600">Dashboard</text>
    <text x="170" y="704" text-anchor="middle" font-size="9.5" fill="#3b82f6">Real KPIs + risk chart</text>

    <rect x="262" y="664" width="160" height="60" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="342" y="688" text-anchor="middle" font-weight="600">Workbench</text>
    <text x="342" y="704" text-anchor="middle" font-size="9.5" fill="#3b82f6">Human-in-the-loop</text>

    <rect x="434" y="664" width="160" height="60" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="514" y="688" text-anchor="middle" font-weight="600">AI Policies</text>
    <text x="514" y="704" text-anchor="middle" font-size="9.5" fill="#3b82f6">Live exception_config</text>

    <rect x="606" y="664" width="160" height="60" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="686" y="688" text-anchor="middle" font-weight="600">AI Insights</text>
    <text x="686" y="704" text-anchor="middle" font-size="9.5" fill="#3b82f6">Stats + 1-click apply</text>

    <rect x="778" y="664" width="172" height="60" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="864" y="688" text-anchor="middle" font-weight="600">Data Manager</text>
    <text x="864" y="704" text-anchor="middle" font-size="9.5" fill="#3b82f6">Live + config health</text>

    <rect x="90" y="734" width="160" height="60" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="170" y="758" text-anchor="middle" font-weight="600">New Disruption</text>
    <text x="170" y="774" text-anchor="middle" font-size="9.5" fill="#3b82f6">Submit + trigger Auto</text>

    <rect x="262" y="734" width="160" height="60" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="342" y="758" text-anchor="middle" font-weight="600">AI Manager</text>
    <text x="342" y="774" text-anchor="middle" font-size="9.5" fill="#3b82f6">Gemini chat assistant</text>
  </g>

  <!-- connector supabase <-> command center -->
  <line x1="520" y1="572" x2="520" y2="624" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="624" x2="500" y2="572" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="410" y="602" font-size="10" fill="#64748b">reads live data / writes decisions</text>

  <!-- gemini dashed connector to command center -->
  <path d="M 1130 330 C 1130 480, 950 560, 870 664" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowPurple)"/>

  <!-- ================= Tier 5: Human reviewer ================= -->
  <text x="1010" y="614" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1">05 · HUMAN REVIEWER</text>
  <rect x="1010" y="624" width="240" height="120" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="1130" y="654" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">Human Reviewer</text>
  <text x="1130" y="676" text-anchor="middle" font-size="10.5" fill="#9a3412">Reviews AI recommendation</text>
  <text x="1130" y="692" text-anchor="middle" font-size="10.5" fill="#9a3412">in the Workbench</text>
  <text x="1130" y="716" text-anchor="middle" font-size="10.5" font-weight="600" fill="#c2410c">Approve · Modify · Reject</text>

  <!-- workbench -> human -->
  <line x1="422" y1="694" x2="1010" y2="684" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- human -> supabase (closes loop) -->
  <path d="M 1130 624 C 1130 560, 900 500, 720 500" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="900" y="490" text-anchor="middle" font-size="10" fill="#64748b">decision written back — closes the loop</text>

  <!-- ================= Legend ================= -->
  <g font-size="10.5" fill="#475569">
    <rect x="70" y="870" width="14" height="14" rx="3" fill="#eef2ff" stroke="#818cf8"/>
    <text x="90" y="881">Agent orchestration (Supervity Auto)</text>

    <rect x="340" y="870" width="14" height="14" rx="3" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="360" y="881">System of record (Supabase)</text>

    <rect x="580" y="870" width="14" height="14" rx="3" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="600" y="881">Command Center (this app)</text>

    <rect x="820" y="870" width="14" height="14" rx="3" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="840" y="881">LLM (Gemini) — policies/insights/chat only</text>

    <rect x="1120" y="870" width="14" height="14" rx="3" fill="#fff7ed" stroke="#fdba74"/>
    <text x="1140" y="881">Human-in-the-loop</text>
  </g>

  <text x="660" y="960" text-anchor="middle" font-size="11" fill="#94a3b8">Key design decision: Auto powers agent orchestration end-to-end · Gemini powers reasoning surfaces only · Supabase is the single shared source of truth</text>
</svg>
